[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=TollSimUE
CompanyName=mehdiacho
Description=A1 toll simulator, Unreal Engine showpiece
CopyrightNotice=

[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
; The scene is spawned in code on the engine's Entry map and finds most assets by folder at
; runtime (LoadModels, LoadFoliage), so the cook gets an explicit list. Cooking every map
; would pull in the City Sample and Namaqualand demo levels. The pack meshes the scene uses come
; from /Game/Toll/DA_CookList (Scripts/make_cook_list.py), not whole pack folders.
bCookAll=False
bCookMapsOnly=False
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Game/Toll")
+DirectoriesToAlwaysCook=(Path="/Game/ThirdParty")
BuildConfiguration=PPBC_Shipping
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
IncludeDebugFiles=False
